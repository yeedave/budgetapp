name: Build & Release

# Triggers a build whenever you push a version tag like v1.0.0.
# Produces a Mac .zip (containing Jade Banking.app) and a Windows .zip
# (containing Jade Banking.exe + supporting files), then attaches them to
# a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller packaging/jadebanking.spec --clean --noconfirm

      - name: Zip the artifact (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r "JadeBanking-macos.zip" "Jade Banking.app"

      - name: Zip the artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd dist
          powershell Compress-Archive -Path "Jade Banking" -DestinationPath "JadeBanking-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JadeBanking-${{ matrix.os }}
          path: dist/JadeBanking-*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.zip
          generate_release_notes: true
